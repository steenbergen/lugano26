<svg xmlns="http://www.w3.org/2000/svg" width="680" height="382" viewBox="0 0 680 382" role="img">
  <title>Dice and IoU as overlap ratios</title>
  <desc>Two overlapping rectangles inside a box of all pixels. The intersection is true positives, the truth-only part false negatives, the prediction-only part false positives, and the surround true negatives, which appears in neither formula.</desc>
  <style>
    text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .t  { font-size: 14px; fill: #2C2C2A; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .box  { fill: #FFFFFF; stroke: #D3D1C7; stroke-width: 1; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1.5; }
    .c-purple text { fill: #3C3489; }
    .c-teal rect   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1.5; }
    .c-teal text   { fill: #085041; }
    .c-coral rect  { fill: #FAECE7; stroke: #993C1D; stroke-width: 1.5; }
    .c-coral text  { fill: #712B13; }
    .c-gray rect   { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1.5; }
    .c-gray text   { fill: #444441; }
  </style>
  <text class="ts" x="280" y="48" text-anchor="middle">ground truth</text>
  <text class="ts" x="400" y="48" text-anchor="middle">prediction</text>
  <rect class="box" x="100" y="56" width="460" height="190" rx="4"/>
  <g class="c-coral"><rect x="170" y="86" width="220" height="130" rx="4"/></g>
  <g class="c-coral"><rect x="290" y="86" width="220" height="130" rx="4"/></g>
  <g class="c-teal"><rect x="290" y="86" width="100" height="130" rx="4"/><text class="t" x="340" y="146" text-anchor="middle">TP</text><text class="ts" x="340" y="166" text-anchor="middle" fill="#085041">correct</text></g>
  <g class="c-coral"><text class="t" x="230" y="146" text-anchor="middle">FN</text><text class="ts" x="230" y="166" text-anchor="middle" fill="#712B13">missed</text></g>
  <g class="c-coral"><text class="t" x="450" y="146" text-anchor="middle">FP</text><text class="ts" x="450" y="166" text-anchor="middle" fill="#712B13">false alarm</text></g>
  <text class="ts" x="122" y="236">TN &#8212; in neither formula</text>
  <rect class="box" x="90" y="272" width="240" height="70" rx="4"/>
  <text class="th" x="112" y="300">IoU (Jaccard)</text>
  <text class="ts" x="112" y="324">TP / (TP + FP + FN)</text>
  <rect class="box" x="350" y="272" width="240" height="70" rx="4"/>
  <text class="th" x="372" y="300">Dice (F1)</text>
  <text class="ts" x="372" y="324">2 TP / (2 TP + FP + FN)</text>
</svg>
